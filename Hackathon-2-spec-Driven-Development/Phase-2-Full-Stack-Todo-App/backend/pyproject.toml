[tool.poetry]
name = "fastapi-todo-api"
version = "0.1.0"
description = "Secure FastAPI Todo API with Neon DB & JWT Auth"
authors = ["Claude Code <claude@anthropic.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.2"
sqlmodel = "^0.0.14"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
PyJWT = "^2.8.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
uvicorn = {extras = ["standard"], version = "^0.27.1"}
asyncpg = "^0.29.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.3"
httpx = "^0.26.0"
black = "^24.0.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]